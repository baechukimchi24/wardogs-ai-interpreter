name: Build Windows Portable EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install build packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller argostranslate
      - name: Build portable EXE
        shell: pwsh
        run: python build_portable.py
      - name: Verify files
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/WARDOGS Interpreter/WARDOGS Interpreter.exe')) { throw 'EXE missing' }
          if (!(Test-Path 'dist/WARDOGS Interpreter/bin/process_loopback.exe')) { throw 'Capture missing' }
      - name: ZIP release package
        shell: pwsh
        run: Compress-Archive -Path 'dist/WARDOGS Interpreter' -DestinationPath 'WARDOGS_Interpreter_Portable_Windows_x64.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: WARDOGS_Interpreter_Portable_Windows_x64
          path: WARDOGS_Interpreter_Portable_Windows_x64.zip
